name: .NET CI - Build & Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore src/E-Wallet/E-Wallet.sln

      - name: Build Solution
        run: dotnet build src/E-Wallet/E-Wallet.sln --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test src/E-Wallet/E-Wallet.sln --configuration Release --no-build --verbosity normal
