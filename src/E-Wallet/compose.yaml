services:
  
  identitydb:
    image: postgres:17
    container_name: identitydb
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: IdentityDb
    ports:
      - "5433:5432"
    volumes:
      - "postgres_identity:/var/lib/postgresql/data/"



volumes:
  postgres_identity: