services:
  
  identitydb:
    image: postgres:17
    container_name: identitydb
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: IdentityDb
    ports:
      - "5433:5432"
    volumes:
      - "postgres_identity:/var/lib/postgresql/data/"
  accountdb:
    image: postgres:17
    container_name: accountdb
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: AccountDb
    ports: 
      - "5434:5432"
    volumes:
      - "postgres_account:/var/lib/postgresql/data/"
  notificationdb:
    image: mongo:latest
    restart: always
    container_name: notificationdb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
  messagebroker:
    image: rabbitmq:management
    hostname: ewallet-mq
    container_name: messagebroker
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
  identityapi:
    image: identityapi
    build:
      context: .
      dockerfile: Services/Identity/Identity.Api/Dockerfile
    depends_on:
      - identitydb
      - messagebroker
    ports:
      - "6000:8080"
      - "6060:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - MessageBroker__Host=amqp://ewallet-mq:5672
      - MessageBroker__Password=guest
      - MessageBroker__UserName=guest
      - ConnectionStrings__Database=Server=identitydb;Database=IdentityDb;Username=postgres;Password=postgres;
      - ASPNETCORE_Kestrel__Certificates__Default__Password=Sifre123!
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
    volumes:
      - ${USERPROFILE}\.aspnet\https:/https:ro
  accountapi:
    image: accountapi
    build:
      context: .
      dockerfile: Services/Account/Account.Api/Dockerfile
    depends_on:
      - accountdb
      - messagebroker
    ports:
      - "6001:8080"
      - "6061:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__Database=Server=accountdb;Database=AccountDb;Username=postgres;Password=postgres;
      - MessageBroker__Host=amqp://ewallet-mq:5672
      - MessageBroker__Password=guest
      - MessageBroker__UserName=guest
      - ASPNETCORE_Kestrel__Certificates__Default__Password=Sifre123!
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
    volumes:
      - ${USERPROFILE}\.aspnet\https:/https:ro
  notificationapi:
    image: notificationapi
    build:
      context: .
      dockerfile: Services/Notification/Notification.Api/Dockerfile
    depends_on:
      - notificationdb
      - messagebroker
    ports:
      - "6002:8080"
      - "6062:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__MongoDb=mongodb://notificationdb:27017
      - SmtpSettings__Host=mailhog
      - MessageBroker__Host=amqp://ewallet-mq:5672
      - MessageBroker__Password=guest
      - MessageBroker__UserName=guest
      - ASPNETCORE_Kestrel__Certificates__Default__Password=Sifre123!
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
    volumes:
      - ${USERPROFILE}\.aspnet\https:/https:ro
  yarpapi:
    image: yarpapi
    build: 
      context: .
      dockerfile: ApiGateways/YarpApiGateway/Dockerfile
    ports:
      - "6003:8080"
      - "6063:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ASPNETCORE_Kestrel__Certificates__Default__Password=Sifre123!
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
    depends_on:
      - identityapi
      - accountapi
      - notificationapi
    volumes:
      - ${USERPROFILE}\.aspnet\https:/https:ro
volumes:
  postgres_identity: 
  postgres_account:
  mongodb_data: